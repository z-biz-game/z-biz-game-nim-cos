name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No bundler and no dependencies: the game ships plain ES modules, so the site is a
      # file copy. Only these three paths are reachable from index.html — keep the server,
      # the electron shell, the generator and the tests out of the artifact.
      - name: Assemble static site
        run: |
          mkdir _site
          cp index.html _site/
          cp manifest.webmanifest sw.js _site/
          cp -r css js _site/
          # 图标、社交卡、桌布与粒子贴图是运行时真去读的文件，必须进产物；
          # assets/gen/ 是产出它们的脚本，跟着仓库走但不跟着站点走。
          mkdir -p _site/assets
          cp -r assets/icons assets/og assets/textures _site/assets/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
